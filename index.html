<h1>dobm10@bis174</h1>
<p>Hi, this is my server for 4SA313.</p>

<h2>status</h2>
<pre id="status">loading...</pre>

<h2>bots trying to get in</h2>
<pre id="attacks">loading...</pre>

<script>
function load(file, id) {
  fetch(file + "?" + Date.now())
    .then(r => r.text())
    .then(text => document.getElementById(id).textContent = text);
}
function update() {
  load("status.txt", "status");
  load("attacks.txt", "attacks");
}
update();
setInterval(update, 60000);
</script>
